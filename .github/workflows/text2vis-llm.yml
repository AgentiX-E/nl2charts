name: text2vis-llm

# The chart half, answered by a model.
#
# Two readings live beside this one and neither costs a model call: `text2vis-rule` scores the cue
# table and the recommender against the corpus, on every push that touches the chart code. What
# neither can answer is the question the next round's plan depends on — how far a *model* gets on the
# same rows — because that answer costs one call per row.
#
# **Dispatch-only, and not on `push`.** 1,470 questions x 2 scales x 1 model is 2,940 calls, and a
# trigger would spend that on every commit to `eval/text2vis/**` in exchange for a number that only
# moves when the prompt, the option list or the model does. That is the discipline the competitor
# readings already follow: a number is *recorded*, and a record is not a test.
#
# **Two scales, because they answer two questions.** `mark` offers the eleven marks this product can
# draw and is scored by `profile.ts`'s own scorer, so its top-1 is comparable with the 41.22% the
# product reads. `label` offers the corpus's own chart names and counts exact family matches, which is
# the number a Text2Vis paper reports — and the only place the three families no mark can lead with
# (`area`, `histogram`, `violin`) can be seen at all.
#
# **The reply store is why a second dispatch is cheap.** Answers are keyed on the exact request —
# messages, model, temperature, budget, and a prompt version written by hand — so a dispatch after a
# one-line change pays for the rows that changed. The cache is restored from the previous run of the
# same prompt version, and a bump of `PROMPT_VERSION` in `eval/text2vis/llm.ts` starts a new key space
# rather than serving answers to a prompt nobody sends any more.

on:
  workflow_dispatch:
    inputs:
      models:
        # A comma-separated list, and the primary is always first. Two models in one dispatch is the
        # strong-against-weak comparison on one corpus and one download, which a matrix job would pay
        # for twice.
        description: 'Primary model, optionally followed by a second (comma-separated)'
        required: true
        default: 'deepseek-chat'
        type: string
      scales:
        # `mark` is the decision variable; `label` is the SOTA comparison. Both by default, because a
        # dispatch that took only the first would leave the reachable ceiling unexplained.
        description: 'Scales to price: mark, label, or mark,label'
        required: true
        default: 'mark,label'
        type: choice
        options:
          - 'mark,label'
          - 'mark'
          - 'label'
      limit:
        # The smoke run. A prefix rather than a stride because this arm has no pairing between two
        # samples of itself; what it pairs is the model against the product, and both are read from
        # the same rows in the same run.
        description: 'Ask only the first N rows (0 asks every scored row)'
        required: true
        default: '0'
        type: string
      concurrency:
        # A one-word answer to a 200-token prompt: the calls are short and the endpoint is a chat tier.
        # 6 keeps the wall clock near ten minutes for 2,940 calls without putting a burst on the key.
        description: 'Calls in flight at once'
        required: true
        default: '6'
        type: string
      second_base_url:
        # Empty, so that the endpoint is a *consequence* of the provider rather than a second default
        # that can disagree with it. `bird-dev.yml` learned this from run `41791956315`: a valid key,
        # a right model name, and the other vendor's host, answered as `401 令牌已过期或验证不正确`.
        description: 'Base url for the second model, when one is named (empty takes it from second_provider)'
        required: false
        default: ''
        type: string
      second_provider:
        # Which vendor the second model belongs to, and therefore which endpoint and which key. The
        # reading this dispatch exists for is `deepseek-chat,deepseek-reasoner`: one provider's chat
        # mode against its own thinking mode, on one corpus, in one run — the strong-against-weak
        # comparison the model floor has been waiting for since it was registered.
        description: 'Vendor of the second model, when one is named'
        required: true
        default: 'zhipu'
        type: choice
        options:
          - 'zhipu'
          - 'deepseek'

permissions:
  contents: read

# One at a time per prompt version: the store is the point, and two dispatches filling it in parallel
# would answer the same keys twice.
concurrency:
  group: text2vis-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arms:
    name: what a model answers on the same 1,470 rows
    runs-on: ubuntu-latest
    # 60 minutes was sized for a chat model: 2,940 calls of one word each at concurrency 6. A reasoning
    # model writes a chain of thought per row and the wall clock is the deliberation, not this job. The
    # cap is a backstop against a hung run, not an estimate — run `44681062395` spent ten minutes on the
    # reasoning arm before its first timeout, and every answer it bought is in the store, so a run that
    # does hit the cap resumes rather than re-pays.
    timeout-minutes: 100
    env:
      # The primary is the text backbone the BIRD jobs already use, so the org secret is the one that
      # exists rather than a new one. The second model takes the vision endpoint's key because that is
      # where the other vendor's credential lives.
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: 'https://api.deepseek.com/v1'
      TEXT2VIS_LLM_MODELS: ${{ inputs.models }}
      # Derived, never defaulted: the provider names the host and the key together, because the two
      # ways to get it wrong — DeepSeek's model on Zhipu's host, or Zhipu's key on DeepSeek's — both
      # answer 401 and both read as an expired token.
      TEXT2VIS_SECOND_BASE_URL: ${{ inputs.second_base_url != '' && inputs.second_base_url || (inputs.second_provider == 'deepseek' && 'https://api.deepseek.com/v1' || 'https://open.bigmodel.cn/api/paas/v4') }}
      TEXT2VIS_SECOND_API_KEY: ${{ inputs.second_provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || secrets.ZHIPU_API_KEY }}
      TEXT2VIS_LLM_CONCURRENCY: ${{ inputs.concurrency }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The corpus, kept between runs: the file is immutable upstream, and a reading whose first step
      # is a download reports a network as a score when the network is what failed.
      #
      # The path is the CSV, not the directory. Caching `eval/.cache/text2vis` also cached the answer
      # store that lives under it — a second store, frozen at whatever the first save contained, and
      # restored *after* the answers step, which is how an archive of the corpus came to carry answers
      # to questions this arm no longer asked.
      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: eval/.cache/text2vis/*.csv
          key: text2vis-corpus-v1

      # The instrument, before the measurement: how many rows, which labels, how many are scored.
      - name: Read the corpus
        run: pnpm bench:text2vis:dataset

      # What the answers belong to: the corpus, not the calendar. It goes in the answers key below for
      # the reason the judge's figures digest does.
      - name: Name the corpus this run asks about
        id: corpus
        run: echo "digest=$(sha256sum eval/.cache/text2vis/*.csv 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The rest of the key, flattened into a slug. Run `44442360115` is the receipt for why: the key
      # interpolated `inputs.scales` directly, a dispatch of `mark,label` produced a key containing a
      # comma, and `actions/cache/restore` answered `Key Validation Error: … cannot contain commas` —
      # the restore failed, the ask was skipped, and the run cost nothing but measured nothing. An
      # input is free text and a cache key is not, so the input becomes a slug before it becomes a key.
      # The values arrive as environment variables rather than as `${{ }}` inside the shell, because an
      # input is also a place where a quote could come from.
      - name: Name the instrument this run asks with
        id: instrument
        env:
          MODELS: ${{ inputs.models }}
          SCALES: ${{ inputs.scales }}
          LIMIT: ${{ inputs.limit }}
        run: echo "slug=$(printf '%s-%s-%s' "$MODELS" "$SCALES" "$LIMIT" | tr , _ | tr -c 'A-Za-z0-9._-' _)" >> "$GITHUB_OUTPUT"

      # The answers, kept between runs. This is the whole reason a second dispatch of the same
      # questions costs nothing rather than ¥1.25.
      #
      # The key was a constant — `text2vis-llm-answers-v1-<model>` — and a constant key is a cache
      # that is written once and then never again: GitHub refuses to save over an existing key, so
      # after the first successful save the store in CI is frozen while the store on the runner keeps
      # growing. Run `44435717857` has the receipt. It restored the v1 archive, asked 2,940 questions,
      # hit **0** of them — the cap had moved 32 → 96 and every key with it — paid ¥1.2522, and then
      # printed `Cache hit occurred on the primary key … not saving cache`: the 2,940 answers it had
      # just bought were discarded. A dispatch after any change to the request paid the full price
      # forever, and no reading could show it, because the cost is in a step that succeeded.
      #
      # So the key follows the contents, the way the judge's does: the corpus digest, and the code
      # that builds the request. A change to a prompt, a budget or a row is a new key and therefore a
      # save; an unchanged request is an exact hit and needs no save. `restore-keys` widens to the
      # same corpus and then to any earlier store, which is why an edit to one prompt re-asks that
      # prompt's rows rather than the corpus.
      #
      # The store travels as a restore and a save, not as one `actions/cache` step, and that is the
      # other half of the same receipt. `actions/cache` saves in a post step that does not run when
      # the job fails, so run `44439035718` — which failed the fidelity gate one row under its floor —
      # bought 2,940 answers, priced them, and threw them away without a save. A save whose
      # `if: always()` is written down is a save that survives the gate that is supposed to protect it.
      - name: Keep the answers already paid for
        id: answers
        uses: actions/cache/restore@v4
        with:
          path: eval/.cache/text2vis/llm-choices
          key: text2vis-llm-answers-v2-${{ steps.instrument.outputs.slug }}-${{ steps.corpus.outputs.digest }}-${{ hashFiles('eval/text2vis/llm.ts', 'eval/text2vis/content-store.ts', 'eval/text2vis/repair.ts', 'packages/chart/src/assist.ts') }}
          # The last line is the frozen v1 archive: not a target, a seed. The store is
          # content-addressed, so an answer bought under the old request is a hit only where the
          # request is unchanged and a miss everywhere else — restoring it costs a download, and not
          # restoring it costs ¥1.25. The line above `restore-keys` rather than inside it, because a
          # `|` block is text: run `44549009308` put these four comment lines into the key list, and
          # GitHub answered `Key Validation Error: # The frozen v1 archive. … cannot contain commas`.
          restore-keys: |
            text2vis-llm-answers-v2-${{ steps.instrument.outputs.slug }}-${{ steps.corpus.outputs.digest }}-
            text2vis-llm-answers-v2-${{ steps.instrument.outputs.slug }}-
            text2vis-llm-answers-v2-
            text2vis-llm-answers-v1-

      - name: Ask every model on every scale
        run: |
          LIMIT=""
          if [ "${{ inputs.limit }}" != "0" ]; then LIMIT="--limit ${{ inputs.limit }}"; fi
          pnpm bench:text2vis:llm --artifact eval/out/text2vis-llm.json \
            --scales "${{ inputs.scales }}" $LIMIT

      # The second question, on the rows the table refused — and the product does **not** ship it. Run
      # `44648039546` measured it: 200 rows asked for ¥0.058, 36 right against the table's 39, and the
      # shipped reading fell 754 → 751. The verdict is recorded in `eval/text2vis/baseline.json`
      # (`llm.repair.verdict: rejected`), and this step stays because a rejected option that is no
      # longer measured is an option somebody will propose again. It is ¥0 from the second dispatch on:
      # the answers are in the same content-addressed store.
      - name: Ask the refused rows the narrower question, and price the answer the product refuses
        run: pnpm bench:text2vis:repair --answers eval/out/text2vis-llm.json --artifact eval/out/text2vis-repair.json

      # Before the gate, not after it. What this step saves was paid for by the steps above, and the
      # reading it produced is a separate question: a run that misses its floor has still bought its
      # answers, and the next dispatch should not buy them again.
      - name: Keep what this run paid for
        if: always()
        uses: actions/cache/save@v4
        with:
          path: eval/.cache/text2vis/llm-choices
          key: ${{ steps.answers.outputs.cache-primary-key }}

      # The floor, when one has been registered. A first dispatch establishes the number; the commit
      # that earns it writes it into `eval/text2vis/baseline.json`, and every dispatch after that is
      # held to it — the same rule the recommender's reading follows, and for the same reason: a
      # number nobody refuses can fall as quietly as it rose.
      - name: Hold the model to its recorded reading
        run: node tools/check-text2vis-baseline.mjs --llm --require

      # The arbitration, and it is the cheapest step in this file: no model is asked anything, because
      # the answers are in the artifact the step above wrote. What it prices is the only shippable
      # question — given the question, the table's answer and the model's answer, how many of the rows
      # the two disagree about can a rule route correctly? The 991-row union is the ceiling any such
      # rule is aiming at, and no rule may look at the answer key to get there.
      - name: Price the arbitration between the two answers
        run: pnpm bench:text2vis:arbitrate --answers eval/out/text2vis-llm.json --artifact eval/out/text2vis-arbitrate.json


      # The table is a gate, not a printout. Six readings that add up to a ceiling are the only reason
      # anyone can compare policies at all, and a policy that quietly routes every row to one answer
      # reads exactly like a policy that works — so the identities are re-checked on the file: the
      # disagreement partitions the population, the ceiling is the union of the three cells, every
      # policy's hits are its own three cells, and the headline is the maximum of the table.
      - name: Hold the arbitration to its recorded reading
        run: node tools/check-text2vis-baseline.mjs --arbitration --require

      # The shipped path, priced on the same answers. `arbitrate.ts` shows that a rule *could* reach
      # 861 by routing between the two answers; this runs the code that would ship it — `assistedMark`
      # for the decision and `assistedChartIR` for the chart — and asserts the two agree row for row.
      # A policy that reads well in a table and a product that behaves differently are two claims, and
      # only one of them is worth publishing. Costs nothing: the answers are already on disk.
      - name: Ship the winning policy and prove it is the product
        run: pnpm bench:text2vis:ship --answers eval/out/text2vis-llm.json --artifact eval/out/text2vis-ship.json

      # The gate on that reading: the product's decision must be the arbitration's policy, every row
      # must be decided by exactly one side, and a chart may only differ from the decision when a veto
      # replaced it. No model is asked anything here either.
      - name: Hold the shipped path to the arbiter
        run: node tools/check-text2vis-baseline.mjs --ship --require

      # The same six rules, priced on the disagreement between two *models* rather than between the
      # table and one. The round that bought the second arm read 875 against 861 with p = 0.30, which
      # says the two answers are worth the same and says nothing about whether a rule can read them
      # together; `route.ts` prices that, and `--ship` prices what a caller would receive for the
      # routed answers, because a decided number the table can veto is not a shipped one.
      - name: Price the route between the two arms
        run: pnpm bench:text2vis:route --answers eval/out/text2vis-llm.json --require --ship --artifact eval/out/text2vis-route.json

      - name: Upload the reading
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: text2vis-llm
          path: eval/out/text2vis-llm.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the arbitration
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: text2vis-arbitrate
          path: eval/out/text2vis-arbitrate.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the shipped reading
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: text2vis-ship
          path: eval/out/text2vis-ship.json

      - name: Upload the route
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: text2vis-route
          path: eval/out/text2vis-route.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the second question
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: text2vis-repair
          path: eval/out/text2vis-repair.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish the summary
        if: always()
        run: |
          if [ -f eval/out/text2vis-llm.json ]; then
            node -e "
              const payload = require('./eval/out/text2vis-llm.json');
              const pct = (value) => (value * 100).toFixed(2) + '%';
              const rows = payload.arms.map((arm) => {
                const reading = arm.scale === 'mark'
                  ? 'top-1 ' + pct(arm.top1Share) + ' (' + arm.top1 + ' of ' + arm.scored + ')'
                  : 'exact ' + pct(arm.exactShare) + ' (' + arm.exact + ' of ' + arm.scored + ')';
                const cost = arm.cost.yuan === undefined ? 'unpriced' : '¥' + arm.cost.yuan.toFixed(3);
                return '| ' + arm.model + ' | ' + arm.scale + ' | ' + reading + ' | ' + arm.unparsed + ' | ' + arm.truncated + ' | ' + cost + ' |';
              });
              const pairs = payload.paired.map((entry) =>
                '| ' + entry.model + ' | ' + entry.pair.both + ' | ' + entry.pair.ruleOnly + ' | ' + entry.pair.modelOnly + ' | ' + entry.pair.p.toFixed(4) + ' |'
              );
              const lines = [
                '### Text2Vis: a model on the same ' + payload.corpus.asked + ' rows',
                '',
                '| model | scale | reading | unparsed | truncated | cost |',
                '| --- | --- | --- | --- | --- | --- |',
                ...rows,
                '',
                '### Paired against the product, row for row',
                '',
                '| model | both | product only | model only | McNemar p |',
                '| --- | --- | --- | --- | --- |',
                ...pairs,
                '',
                'The product reads 41.22% (606 of 1,470) on the same rows; the cue table alone reads',
                '39.12%. A `mark` arm offers the same eleven marks the product does, so its top-1 is one',
                'subtraction away from that number. A `label` arm offers the corpus\'s own vocabulary and',
                'counts exact family matches: that is the comparable reading for a Text2Vis paper, and',
                'the only one on which `area`, `histogram` and `violin` can be hit at all.'
              ];
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            "
            if [ -f eval/out/text2vis-arbitrate.json ]; then
              node -e "
                const report = require('./eval/out/text2vis-arbitrate.json');
                const pct = (value) => (value * 100).toFixed(2) + '%';
                const rows = report.policies.map((policy) =>
                  '| ' + policy.name + ' | ' + policy.hit + ' (' + pct(policy.share) + ') | ' +
                  policy.kept + ' / ' + policy.keptRight + ' | ' + policy.given + ' / ' + policy.givenRight + ' | ' +
                  (policy.gained - policy.lost >= 0 ? '+' : '') + (policy.gained - policy.lost) + ' | ' + policy.p.toFixed(4) + ' |'
                );
                const lines = [
                  '',
                  '### Arbitration: routing the ' + report.agreement.disagree + ' rows the two answers disagree about',
                  '',
                  '| policy | top-1 | kept (right) | given to model (right) | vs product | McNemar p |',
                  '| --- | --- | --- | --- | --- | --- |',
                  ...rows,
                  '| **ceiling** | ' + report.oracle.hit + ' (' + pct(report.oracle.share) + ') | — | — | — | — |',
                  '',
                  'The ceiling is the union of the two answers and is not a policy: reaching it needs the answer',
                  'key. Every policy above is a rule over the question, the table and the model answer, priced at',
                  '¥0 because no call was made. `best` = **' + report.best + '**; ties are broken by how many rows a',
                  'policy changes, so a rule that reaches the same score by rewriting every answer does not win.'
                ];
                require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
              "
            fi
          else
            echo 'no reading was written, so there is nothing to summarise' >> "$GITHUB_STEP_SUMMARY"
          fi
