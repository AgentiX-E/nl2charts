name: bird-model

# The same harness, a different model.
#
# Every prompt-layer mechanism this project tried landed inside the noise, and two
# were actively unhelpful. What is left between 58% and the published 70-73% is the
# model and the fine-tuning around it, so the model is measured as a variable rather
# than argued about: identical questions, identical pinned inputs, identical arms.
#
# This job runs the same gate as the DeepSeek jobs. The floors in `eval/baseline/bird.json`
# name the model they were taken on (`floorModel`), so a run by another model is measured
# rather than failed on an accuracy threshold that says nothing about either — while the
# funnel, cost, empty-lever, A/A and provenance checks still apply. Before that, this
# workflow skipped the gate entirely, which is how a cross-model run came to have no
# structural checks at all.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model name at the endpoint
        required: true
        default: 'glm-4.5'
      base_url:
        description: OpenAI-compatible base URL
        required: true
        default: 'https://open.bigmodel.cn/api/paas/v4'
      secret_name:
        description: Which org secret holds the key
        required: true
        default: 'ZHIPU_API_KEY'
      arms:
        description: Comma-separated arms (keep it short; each costs a full split)
        required: false
        default: 'names,inline+evidence,values'
      limit:
        description: Questions to score (blank = the whole split)
        required: false
        default: ''
      split:
        description: 'minidev or dev (dev is the split leaderboards report)'
        required: false
        default: 'minidev'
      concurrency:
        description: Parallel calls (a reasoning model needs fewer, and a slow endpoint more time)
        required: false
        default: '2'
      timeout_ms:
        description: Per-call deadline in milliseconds (a reasoning model needs more than a chat model)
        required: false
        default: '300000'
      budget_ms:
        description: Milliseconds any one arm may spend (blank = no limit; 0 is refused)
        required: false
        default: '7200000'
      capabilities:
        description: JSON declaration of what the endpoint does with a request (blank = guess from the name)
        required: false
        default: ''
      aa:
        description: Arm to run twice as an A/A control (blank = none)
        required: false
        default: 'inline+evidence'
      resume_run:
        # A run that outgrew its clock writes the cases it finished beside its artifact and names
        # the path in its own failure message. Passing that run id here spends the remaining cases
        # instead of starting again at zero: a reasoning base at fifty minutes an arm cannot finish
        # a split inside one job, and re-buying the cases it did finish is the difference between a
        # reading and a second attempt.
        description: Workflow run id whose unfinished cases this dispatch continues (blank = start fresh)
        required: false
        default: ''

jobs:
  model:
    name: BIRD ${{ inputs.split }} with ${{ inputs.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      # One slot per provider, not one slot for every run in the repository.
      #
      # The group used to be `bird-eval`, shared with `bird-dev.yml` and `ci.yml`'s Mini-Dev job,
      # because two dev-split runs drawing on one provider quota read as a slow endpoint rather
      # than as two jobs. That reason holds only while the runs share a provider — and this job's
      # whole point is that it does not: `secret_name` names which org secret, and therefore which
      # endpoint, the run will draw on.
      #
      # Sharing the slot cost a run: GitHub keeps only the newest *pending* run in a group, so a
      # `glm-4.6` run queued behind a CI push was cancelled by the next CI push before it started,
      # with `cancel-in-progress: false` and no way to tell from the run list that it never ran.
      # Keying the group by the secret keeps the quota reason and drops the collision: a Zhipu run
      # and a DeepSeek run are two quotas, and two Zhipu runs still serialize.
      #
      # Never cancel in progress — a 60-minute benchmark thrown away by a push is worse than
      # waiting for it.
      group: bird-eval-${{ inputs.secret_name }}
      cancel-in-progress: false
    env:
      # Deliberately not DEEPSEEK_API_KEY: this job must fail loudly if the other
      # provider's key is the one that happens to be present.
      LLM_API_KEY: ${{ secrets[inputs.secret_name] }}
      LLM_BASE_URL: ${{ inputs.base_url }}
      LLM_MODEL: ${{ inputs.model }}
      BIRD_ARMS: ${{ inputs.arms }}
      BIRD_AA: ${{ inputs.aa }}
      BIRD_SPLIT: ${{ inputs.split }}
      # Not eight: a different endpoint has a different rate limit, and a throttled run
      # measures the queue. The provider retries 429 with backoff on top of this.
      BIRD_CONCURRENCY: ${{ inputs.concurrency }}
      BIRD_LLM_RETRIES: '4'
      # Twelve, not three: three clean probes are consistent with a 63% failure rate, which is
      # what let a `glm-4.6` run pass its preflight and then fail 207 of 496 calls. Twelve probes
      # narrow that to 22.1%, and the preflight prints the number it did not rule out.
      BIRD_PREFLIGHT_SAMPLES: '12'
      # A slower model needs a longer deadline, and a timeout reported as "the endpoint was
      # busy" is this harness measuring its own patience: glm-4.5 as primary hit the 60s
      # default on 88% of cases at concurrency 8.
      #
      # The number is an input because a hard-coded deadline is a contract with one model.
      # `glm-4.6` at 180s failed 207 of 496 calls in the `names` arm — 41.7%, above the 10%
      # outage threshold — and every one of them was a timeout, so the run said nothing about
      # the model and everything about the deadline it was given. A caller that knows its
      # endpoint is slower must be able to say so without editing this file.
      BIRD_LLM_TIMEOUT_MS: ${{ inputs.timeout_ms }}
      # Per arm, and it has to be, because what runs out is one arm's time.
      #
      # `42666720439` spent five hours on `metadata+evidence` at two calls in flight and was killed
      # by the 300-minute job cap at `cancelled` — no artifact, and not one line of progress to say
      # where the time went. A job cap cannot report; this can, and what it reports is the
      # `BIRD_LIMIT` the next dispatch should ask for.
      #
      # The arithmetic the caller has to keep: budget × (arms + 1 for A/A) must stay under the job's
      # 300 minutes, or the cap arrives before any reading does. Two hours covers a single arm of
      # 496 cases at eighteen seconds a case with room for the tail.
      BIRD_RUN_BUDGET_MS: ${{ inputs.budget_ms }}
      # What the endpoint does with a request, when its name does not say.
      #
      # The guess is deliberately narrow — `reasoner`, `thinking`, `r1`, `qwq`, `magistral`, `o1`-`o9`
      # — because a wrong guess towards `chat` sends a parameter the endpoint ignores, and a wrong
      # guess towards `reasoning` removes one it would have honoured. `glm-4.6` falls outside it: it
      # is a model that deliberates, its name says nothing, and reading it as a chat model produced
      # 8.5-second completions with empty content on 59% of the cases that landed. A dispatch that
      # knows better says so here rather than renaming the model:
      #   {"family":"reasoning","maxOutputTokens":16384,"thinkingSwitch":true}
      BIRD_CAPABILITIES: ${{ inputs.capabilities }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the dataset
        uses: actions/cache@v4
        with:
          # Both splits are cached by their own key; a dev run that found the Mini-Dev
          # cache would score the wrong questions, and the fetch step would quietly
          # return early because a manifest already existed.
          path: |
            eval/.cache/bird/minidev
            eval/.cache/bird/dev
          key: bird-${{ inputs.split }}-v3-${{ runner.os }}
      - name: Cache the training corpus
        uses: actions/cache@v4
        with:
          path: eval/.cache/bird/train
          key: bird-train-v1-${{ runner.os }}
      - name: Cache the value index
        uses: actions/cache@v4
        with:
          path: eval/.cache/bird/values
          key: bird-values-v1-${{ runner.os }}
      - name: Fetch the split
        run: pnpm bench:bird:fetch
      - name: Fetch the training corpus
        run: pnpm bench:bird:fetch:train
      - name: Fetch the cases an earlier dispatch already paid for
        id: resume
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p eval/out
          gh run download "${{ inputs.resume_run }}" -n bird-eval-model -D /tmp/resume
          # Named explicitly rather than globbed: a partial from a different arm is refused by the
          # runner itself, and a glob would decide by whichever file the shell listed first.
          test -f /tmp/resume/bird-eval.json.partial.json
          cp /tmp/resume/bird-eval.json.partial.json eval/out/bird-eval.json.partial.json
          echo "path=eval/out/bird-eval.json.partial.json" >> "$GITHUB_OUTPUT"
      # This is where a wrong key, a wrong model name or a throttled account shows up
      # in thirty seconds instead of an arm.
      - name: Provider preflight
        run: pnpm eval:preflight
      - name: Gold queries and controls without a model
        run: pnpm bench:bird:dry
      - name: Evaluate with the requested model
        run: pnpm bench:bird
        env:
          BIRD_LIMIT: ${{ inputs.limit }}
          # Empty when nothing is being continued, which `parseResumeFrom` reads as "start fresh".
          # Step-level rather than job-level: a job environment block is evaluated before any step
          # runs, so `steps.resume` does not exist there and the workflow is rejected outright —
          # a failure with no job, no log and nothing in the run list to read.
          BIRD_RESUME_FROM: ${{ steps.resume.outputs.path }}
      - name: Structural gate
        # Accuracy floors are skipped when the model differs from `floorModel`; everything
        # else — expected arms, funnel arithmetic, cost provenance, empty levers, A/A — is
        # not, and applies to any model.
        run: pnpm gate:bird
      - name: Whether each refusal matched the reply behind it
        # This job exists to try unknown endpoints, so the reading that most needs auditing here
        # is the taxonomy: six of this job's own 992 rows (run 43262574193) were prose published
        # as `guard` rejections, and it took a reader with the artifact open to notice.
        #
        # After the structural gate, because the score is already final: a red step here means
        # the taxonomy regressed, not that the model did worse. Guarded on the file rather than
        # `continue-on-error`, so a run that never wrote an artifact says so instead of inventing
        # an audit of nothing.
        if: always()
        run: |
          if [ -f eval/out/bird-eval.json ]; then
            pnpm bench:bird:channel eval/out/bird-eval.json --strict
          else
            echo 'no artifact was written, so there is no taxonomy to audit'
          fi
      - name: Publish summary
        if: always()
        run: |
          if [ -f eval/out/bird-eval.json ]; then
            node tools/bird-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no artifact was written, so there is nothing to summarise' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bird-eval-model
          path: |
            eval/out/bird-eval.json
            eval/out/bird-eval.json.partial.json
            eval/out/bird-summary.md
          if-no-files-found: warn
          retention-days: 30
