name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancellation is per job, not per run.
#
# A run-level group with `cancel-in-progress: true` kills whatever is running the moment
# anything is pushed, and three of these four jobs are *measurements*: a cancelled BIRD job
# publishes no number, so "CI is green" came to depend on how long you waited before pushing
# again rather than on the code. The BIRD job of 40615685536 was cancelled by the push that
# started 40617682709, and the run that replaced it was killed the same way by the next one.
#
# So the cheap check restarts freely and the measurements serialize: a superseded number is
# worth less than no number, and a queued job replaces the queue rather than the run.
permissions:
  contents: read

jobs:
  # What this push has to measure.
  #
  # Two of the four jobs below spend model calls — `bird-eval` sends thirteen arms over 496
  # questions, `live-eval` sends three passes over 210 cases — and neither number can depend
  # on a word in `docs/`. Round 36 pushed a `benchmarks.md` section and a `CHANGELOG` entry
  # and re-priced the whole chain anyway: ~12,800 completions to learn nothing, which is the
  # kind of spend that does not show up in a budget because it is called CI.
  #
  # The rule lives in `tools/ci-scope.mjs` and is tested there, not here: a filter written
  # as five lines of shell is a filter nobody can test, and this one has two edges (an empty
  # file list, and a list long enough for the commit endpoint to have truncated it) that
  # both resolve towards measuring.
  changes:
    name: does this push touch anything a prompt reads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      models: ${{ steps.scope.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # A dispatch is an instruction to measure, and it never reaches the API: someone
          # pressed the button on a number they wanted.
          if [ "$EVENT" != "push" ]; then
            echo "models=true" >> "$GITHUB_OUTPUT"
            echo "dispatched run: measuring regardless of what the tree contains" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! files=$(gh api "repos/$REPO/commits/$SHA" --jq '.files[].filename'); then
            # A filter that cannot read the change set must not become a filter that skips
            # the run: the failure mode of measuring is a bill, the failure mode of not
            # measuring is a publishable number that was never produced.
            echo "models=true" >> "$GITHUB_OUTPUT"
            echo "the commit endpoint could not be read, so this push is measured" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The tool writes the two files itself. Piping its stdout into `$GITHUB_OUTPUT`
          # is what turned this job red on its first run: the parser accepts `key=value`
          # lines and nothing else, and rejected the sentence explaining the decision.
          printf '%s\n' "$files" | node tools/ci-scope.mjs --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  quality:
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cheap, and worth restarting on every push: a type error should be reported for the
    # commit that has it, not for the one before it.
    concurrency:
      group: ci-quality-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nl2charts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nl2charts_test
          MYSQL_USER: analyst
          MYSQL_PASSWORD: s3cret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uanalyst -ps3cret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/nl2charts_test
      MYSQL_TEST_URL: mysql://analyst:s3cret@127.0.0.1:3306/nl2charts_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit and integration tests with coverage
        run: pnpm test:coverage
      - name: Coverage gate (per package, all four dimensions)
        run: pnpm gate:coverage
      # A gate whose failure does not name the short file gets misdiagnosed: `FAIL node
      # st=85.83` read as "coverage fell" for two rounds when it meant "the database services
      # were not running". The self-test plants that tree.
      - name: Coverage gate self-test (names the short file and the unset variable)
        run: node tools/coverage-gate.mjs --self-test
      # The packages are measured and the harness that produces every published number was
      # not, so its coverage could only go down. This is not a threshold — `eval/` is at 64%
      # and a 95% red would be red for months — it is a ratchet against a committed ledger:
      # no file may measure lower than it did, and the distance to 95% is printed on every
      # push so the campaign's progress is a diff rather than a claim.
      - name: Eval coverage ratchet (no file below its ledger)
        run: node tools/check-eval-coverage.mjs --self-test && node tools/check-eval-coverage.mjs
      - name: Dependency layering
        run: pnpm gate:layering
      - name: Layering checker self-test
        run: node tools/check-layering.mjs --self-test
      - name: Platform boundary (PLT1-PLT7)
        run: node tools/check-platform.mjs
      - name: Platform checker mutations (7/7 must be detected)
        run: node tools/check-platform.mjs --self-test
      - name: Public API snapshot
        run: pnpm gate:exports
      - name: Bundle budgets
        run: pnpm gate:budgets
      - name: Statement guard red team (attacks, false rejects, mutation)
        run: pnpm bench:guard
      - name: Secret scan (tracked files, no values printed)
        run: pnpm gate:secrets
      - name: Secret scan self-test
        run: node tools/check-secrets.mjs --self-test
      - name: Benchmark floor self-test
        run: node tools/check-bird-baseline.mjs --self-test
      - name: Summary renderer self-test
        # The job summary is the only part of a benchmark run a human reads, and a
        # formatter that prints the wrong column looks exactly like a run that measured
        # the wrong thing.
        run: node tools/bird-summary.mjs --self-test
      - name: Stratification self-test
        # The stratum join is how a mixed arm's gain gets attributed, so the join itself
        # is tested rather than trusted.
        run: node tools/stratify-mixed.mjs --self-test
      - name: Gate parity self-test
        run: node tools/check-gate-parity.mjs --self-test
      - name: Gate parity (gate:all covers what this job runs)
        # `pnpm gate:all` read like the whole gate and was a third of it, which is how a type
        # error reached this job on a commit whose author had run it.
        run: node tools/check-gate-parity.mjs
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  benchmark:
    name: benchmark and ablation
    needs: quality
    runs-on: ubuntu-latest
    # A number, not a check: an arm that was cancelled half way scores nothing, and the
    # artifact that would have explained it does not exist either.
    concurrency:
      group: ci-benchmark-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execution accuracy with positive and negative controls
        run: pnpm bench
      - name: Schema linking recall ablation
        run: pnpm bench:linking
      - name: Normalization paired ablation
        run: pnpm bench:ablate
      - name: Semantic compiler ablation
        run: pnpm bench:semantic
      - name: Publish summary
        # Same reason as the BIRD jobs: a failed benchmark is the run whose numbers are
        # needed, and a summary that only runs on success publishes the passing runs only.
        if: always()
        run: |
          if [ -f eval/out/results.json ]; then
            node tools/bench-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no artifact was written, so there is nothing to summarise' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark
          path: eval/out/
          retention-days: 30

  live-eval:
    name: live NL to SQL evaluation
    if: >-
      needs.quality.result == 'success' &&
      needs.changes.outputs.models == 'true' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    needs: [quality, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: live-eval
      cancel-in-progress: false
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-chat
      LIVE_CONCURRENCY: '6'
      LIVE_REPEATS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate 210 cases and their gold queries without a model
        run: pnpm bench:live:dry
      - name: Live model evaluation with ablations
        run: pnpm bench:live
      - name: Publish summary
        if: always()
        run: node tools/live-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload live evaluation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-eval
          path: eval/out/live-eval.json
          if-no-files-found: warn
          retention-days: 30

  bird-eval:
    name: BIRD Mini-Dev external evaluation
    if: >-
      needs.quality.result == 'success' &&
      needs.changes.outputs.models == 'true' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    needs: [quality, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: bird-eval
      cancel-in-progress: false
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-chat
      # No cap: the runner defaults to the whole split. A cap belongs on the
      # command line when a sample is wanted, not here where it silently became the
      # denominator of every published number.
      BIRD_CONCURRENCY: '8'
      # The same arm twice, so the harness measures its own noise at the sample size
      # it publishes. Without it, a 1pp delta between two arms has no scale.
      BIRD_AA: inline+evidence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the external dataset
        uses: actions/cache@v4
        with:
          path: eval/.cache/bird/minidev
          key: bird-minidev-v3-${{ runner.os }}
      - name: Cache the training corpus
        uses: actions/cache@v4
        with:
          # 4.2 MB of labelled questions, not the 8.5 GB archive they arrive in: the
          # training databases are never executed here.
          path: eval/.cache/bird/train
          key: bird-train-v1-${{ runner.os }}
      - name: Cache the value index
        uses: actions/cache@v4
        with:
          # 45k distinct cell values across eleven databases, five megabytes: one query
          # per column to build, so it is worth keeping between runs.
          path: eval/.cache/bird/values
          key: bird-values-v1-${{ runner.os }}
      - name: Cache synthesized definitions
        uses: actions/cache@v4
        with:
          path: eval/.cache/bird/definitions
          key: bird-definitions-${{ runner.os }}-${{ hashFiles('eval/bird/synthesize.ts', 'packages/ai/src/definitions.ts') }}
          restore-keys: bird-definitions-${{ runner.os }}-
      - name: Fetch Mini-Dev (no-op when the cache is warm)
        run: node eval/bird/fetch.mjs
      - name: Fetch the training corpus (no-op when the cache is warm)
        run: pnpm bench:bird:fetch:train
      # One call before five hundred: a refused key or an exhausted balance should cost
      # thirty seconds, not an arm.
      - name: Provider preflight
        run: pnpm eval:preflight
      - name: Gold queries, prompts and controls without a model
        run: pnpm bench:bird:dry
      # No model calls: renders the prompt and checks that every identifier the gold
      # statement names is visible in it. If this drops, the model is being asked to use a
      # column it was never shown, and no wording can recover that.
      - name: Every gold identifier is in the prompt
        run: pnpm bench:bird:recall
      - name: DuckDB portability census
        run: pnpm bench:bird:port
      # No number in the label: the chain has been ten, eleven and sixteen arms, and a step name
      # that counts is a step name that lies after the next retirement.
      - name: Every arm in the chain, with paired ablations and an A/A control
        run: pnpm bench:bird
      # Before the gate, because the gate requires it: each pair this split declares is read here,
      # inside this artifact, on the same questions by the same judge. A pair across two runs is
      # not a delta — on the two Mini-Dev runs of 2026-11-08 the unchanged `select` arm read 56.05%
      # and 58.06% with every coordinate equal, and the placement pair that was published as +3.6pp
      # is 17 against 18 here. The output is what the summary and `docs/benchmarks.md` quote.
      - name: Paired readings (a delta exists only inside one run)
        run: pnpm bench:bird:pair --declared eval/out/bird-eval.json
      - name: Accuracy floor (a regression fails the build)
        run: pnpm gate:bird
      # The score is a product of two mechanisms — the candidate set and the selector — and
      # the floor above only guards the product. This one splits it: every question whose
      # candidate set held no answer is classified by the shape of its failure, which is the
      # 34pp column nothing had ever measured and the 4.6pp column everything had been.
      - name: Where the candidate set had no answer
        run: pnpm bench:bird:gap
      # The next level down, and now a gate rather than a measurement: the values bucket is
      # split into the clause a fix would change, and on both splits it reaches a named cause
      # for more than 99% of the bucket. `--strict` says what a drop below four fifths would
      # mean — the taxonomy stopped explaining the corpus — which is a regression in the
      # instrument, and the instrument is what the next iteration is planned from.
      - name: What kind of wrong the no-answer statements are
        run: pnpm bench:bird:gap:values eval/out/bird-eval.json --arm select --strict
      # The same ladder over every no-answer case, not just the `values` bucket. The exclusion
      # it lifts was justified by "a statement whose width is wrong cannot be diagnosed clause
      # by clause — the projection is the finding"; the width step below tries that finding
      # (every subset of the select list, executed) and recovers 11 of 37 wide cases, so 26 of
      # them are wrong for a reason this ladder can name. A measurement, not a gate: the
      # taxonomy's coverage is gated one step up.
      - name: The same ladder over every no-answer case
        run: pnpm bench:bird:gap:values eval/out/bird-eval.json --arm select --scope all
      # Prices the projection lever before anyone writes it: delete items from the select list,
      # every subset, and ask the judge again. What it recovers is an oracle's ceiling — the
      # subsets are chosen with knowledge of the answer's width — so no implementable rule can
      # beat it. `--strict` fails only if the instrument cannot read a statement, which is how a
      # silent zero would otherwise look exactly like a corpus with nothing to recover.
      - name: What the answer's width costs, and what removing columns would recover
        run: pnpm bench:bird:width eval/out/bird-eval.json --arm select --strict
      # The next level down from the ladder's `predicate` row: of the conditions the gold
      # states, which ones name a column the statement never filters on at all. Zero model
      # calls and zero queries — both statements are in the artifact — and the ladder artifact
      # joins in so the reading is per bucket.
      - name: Which condition the statement never wrote
        run: pnpm bench:bird:conditions eval/out/bird-eval.json --arm select --ladder eval/out/values-gap-select-all.json --strict
      # The same census on the pair the audit arm was built for: the arm it was added to, and the
      # arm with the turn. The population is defined by the first reading (a gold filter whose
      # column is absent) and the second is the only number that says whether the turn closed
      # any of it. No ladder here: both arms generate once per case, so the bucket a failure
      # falls in is the ladder's `select` reading rather than its own.
      - name: The same census on the arm the audit was added to
        run: pnpm bench:bird:conditions eval/out/bird-eval.json --arm inline+evidence --strict
      - name: The same census after the audit turn
        run: pnpm bench:bird:conditions eval/out/bird-eval.json --arm inline+evidence+audit --strict
      # Where the prompt's characters go, and what a smaller card could save. The card is
      # three quarters of every call and one case in six had a linker that named nothing at
      # all, so the two numbers that matter are the oracle ceiling and the coverage of the
      # linker that ships. Zero model calls: the prompt is rebuilt by the function the
      # pipeline sends, and the gate fails only if it could not be rebuilt.
      - name: What the prompt costs, and what a smaller card would save
        run: pnpm bench:bird:card eval/out/bird-eval.json --arm select --strict
      # The pruned card's reading moved with its arm: `select-prune` now runs on demand, because
      # its verdict is in (−1.4pp, and the loss is the ceiling rather than the selector) and its
      # gap on 498 questions is inside its own MDE. A second invocation here would have been a
      # step that fails on an arm the run does not contain — which is what the presence check
      # now says out loud instead of printing a table of zeros.
      # Whether the tables a question never names can be reached by a join. The card measurement
      # priced the lever and this one says who can pull it: a question that names an entity and
      # none of its columns is one case in six, and the foreign keys are what carry it to the
      # partner table the answer reads. Zero model calls, and the gate is the graph's own
      # consistency rather than a target share.
      - name: What a question names, and what its answer joins
        run: pnpm bench:bird:join eval/out/bird-eval.json --arm select --strict
      # The coverage axis the plan asked for, one level down. Identifier coverage is saturated
      # — the recall gate above reports every gold identifier visible, in every split — so the
      # only coverage with variance left is whether the value a gold filter compares against is
      # spelled in the prompt at all. Zero model calls: the prompt is rendered from the
      # artifact's own definitions and the split's own questions, so this measures the prompt
      # that was sent rather than a reconstruction of it.
      - name: What the prompt would have had to say
        run: pnpm bench:bird:info eval/out/bird-eval.json --arm select --strict
      # The instrument behind the deterministic half of the repair question, and the one gate
      # that can be absolute: a statement edit offered only to statements that returned nothing
      # must touch no gold statement, because no gold answer in this split is empty. The number
      # of cases it recovers is a reading, not a floor — the repair recovers two, which is below
      # what a paired test can resolve, and saying so is the point of running it every commit.
      - name: What one provable edit recovers, and what it would break
        run: pnpm bench:bird:repair eval/out/bird-eval.json --arm select --strict
      # The half of the score that is not the selector. An arm's accuracy is its candidate
      # set times the rate at which the selector converts it, and this reads both off the
      # artifact — the ceiling from `candidates[]`, the conversion from `passed`. Zero model
      # calls, and no floor: the number it prints is a claim about where the next call is
      # worth spending, so the reading is the finding.
      - name: What one more candidate would buy
        run: pnpm bench:bird:pool --artifact eval/out/bird-eval.json
      # The other half. The pool step prices the ceiling; this prices the rules that convert it,
      # from the same rows — `first`, `shortest` and modal agreement are functions of what the
      # artifact now records per candidate, so a rule costs a reading instead of a run. A rule
      # whose input the artifact does not carry is named as unavailable rather than scored zero,
      # which is what makes this safe to run on an artifact written before the fields existed.
      - name: Which selection rule kept the answer
        run: pnpm bench:bird:consensus --artifact eval/out/bird-eval.json
      - name: Noise floor (same cases, three repeats)
        run: pnpm bench:bird:stability
      - name: Adversarial gold, widths and controls without a model
        run: pnpm bench:adversarial:dry
      - name: Adversarial shapes (window, ratio, multi-hop, tie)
        run: pnpm bench:adversarial
      - name: Publish summary
        if: always()
        run: node tools/bird-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload BIRD evaluation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bird-eval
          include-hidden-files: true
          path: |
            eval/out/bird-eval.json
            eval/out/bird-pairs.json
            eval/out/duckdb-portability.json
            eval/out/bird-stability.json
            eval/out/adversarial.json
            eval/.cache/bird/definitions/
          if-no-files-found: warn
          retention-days: 30
