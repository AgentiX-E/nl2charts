name: bird-dev

# The public split, on demand.
#
# `ci.yml` runs Mini-Dev (498 questions, 500 rows) on every push because that is what a
# per-commit budget allows. This workflow runs the 1,534-question dev split — the
# one published leaderboards report — so a comparison with another system is a
# matter of running this, not of arguing about samples.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Questions to score (blank = all 1534)
        required: false
        default: ''
      model:
        description: Primary model (blank = deepseek-chat, the alias every published reading used)
        required: false
        # Blank keeps the historical default on purpose. `deepseek-chat` and `deepseek-reasoner`
        # are one base model's non-thinking and thinking modes, not two sizes of model, and both
        # names have left DeepSeek's official list and are routed to V4.1-Flash — so changing the
        # default would silently re-point every comparison in `docs/benchmarks.md` at new weights.
        # The migration belongs in its own change, with `servedModels` in the artifact proving what
        # answered. Until then this input exists so `S1` can ask for a different base explicitly.
        default: ''
      arms:
        description: Comma-separated arms
        required: false
        # Kept byte-identical to `DEV_ARMS` in `eval/bird/run.ts`, which is the authority:
        # `test/bird-arms.test.ts` reads this file and fails when the two disagree, and
        # `eval/baseline/bird.json`'s `armsBySplit.dev` must equal this list plus the arms that
        # need a second model. `select-mixed` is here because it is the ceiling this workflow
        # exists to reproduce (63.0% on 1,532 questions); `select` because this is the split
        # whose MDE (2.30pp) can decide the four-call tier; `select-cross` is not, because it
        # needs a second model that a routine dispatch does not configure.
        default: 'names,inline+evidence,metadata+evidence,select,select-mixed'
      second_model:
        description: Model for `@second` candidate sources (blank = none)
        required: false
        default: ''
      second_base_url:
        description: Endpoint for the second model (blank = the endpoint of the provider named below)
        required: false
        default: ''
      second_provider:
        description: Which secret holds the second key — zhipu (cross-vendor) or deepseek (the control that separates a vendor from a weaker model)
        required: false
        default: 'zhipu'

jobs:
  dev:
    name: BIRD dev (1534 questions)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # One slot for every heavyweight run, shared with `ci.yml`'s Mini-Dev job and with
    # `bird-model.yml`. They draw from the same provider quota and write to the same
    # artifact path, and this workflow used to declare no group at all — so a dispatched
    # dev run and a CI Mini-Dev run overlapped for an hour. The measurement was not wrong,
    # it was slow: 60 minutes for an arm that takes 29 alone, and a slow enough run trips
    # the timeout guards, which then get read as an endpoint verdict.
    concurrency:
      group: bird-eval
      cancel-in-progress: false
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: ${{ inputs.model != '' && inputs.model || 'deepseek-chat' }}
      BIRD_SPLIT: dev
      BIRD_ARMS: ${{ inputs.arms }}
      BIRD_CONCURRENCY: '8'
      # Only read when an arm names an `@second` source. The key is the second provider's
      # own secret, never the primary model's: a run that silently used the primary key
      # against another endpoint would measure the endpoint's auth error, not the model.
      BIRD_SECOND_MODEL: ${{ inputs.second_model }}
      # The endpoint follows the provider, because it did not: a dispatch with
      # `second_provider=deepseek` and the default endpoint sent DeepSeek's key to Zhipu's
      # host, which answered `401 令牌已过期或验证不正确`. The message names an expired token
      # and the token was fine; the run measured a mis-wired endpoint, which is why the two
      # inputs no longer have independent defaults.
      BIRD_SECOND_BASE_URL: ${{ inputs.second_base_url != '' && inputs.second_base_url || (inputs.second_provider == 'deepseek' && 'https://api.deepseek.com/v1' || 'https://open.bigmodel.cn/api/paas/v4') }}
      # A control arm needs the *same* vendor as the primary model, and the only way to
      # express that in Actions is to pick the secret here: `secrets[name]` cannot be
      # indexed by an input. Without this, `select-cross` can only ever mean "a different
      # vendor", and a weaker model's result cannot be told from a vendor's.
      BIRD_SECOND_API_KEY: ${{ inputs.second_provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || secrets.ZHIPU_API_KEY }}
      # A second endpoint has its own rate limit and its own connection behaviour; three
      # attempts (the default) is not enough for a 1,532-question run through a proxy.
      BIRD_LLM_RETRIES: '4'
      BIRD_PREFLIGHT_SAMPLES: '2'
      # The cross arms call a second endpoint whose model is slower than DeepSeek's; 60s was
      # enough when it only wrote one candidate, and this leaves headroom for a busy queue.
      BIRD_LLM_TIMEOUT_MS: '120000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the dev split
        uses: actions/cache@v4
        with:
          path: eval/.cache/bird/dev
          key: bird-dev-20240627-${{ runner.os }}
      - name: Fetch dev (no-op when the cache is warm)
        run: pnpm bench:bird:fetch
      # Worked examples and retrieved evidence read BIRD's *training* split: 9,428 labelled questions
      # over 69 databases that share none with the dev split, so they are knowledge rather than
      # answers. The archive is 8.5 GB and only `train.json` is kept (4.2 MB), so fetching it on every
      # dev run would add minutes to the runs that never read it, and skipping it on a run that does
      # fails an hour later inside the harness with "need the BIRD training split".
      #
      # The question is answered by the arm table, not by this file: `bench:bird:needs-train` resolves
      # `BIRD_ARMS` with the same function the runner uses, so a new arm that reads the split is
      # fetched for by being declared and not by someone remembering to edit a condition here.
      - name: Cache the training split
        uses: actions/cache@v4
        with:
          path: eval/.cache/bird/train
          key: bird-train-20240627-${{ runner.os }}
      - name: Fetch the training split when an arm reads it
        run: |
          if [ "$(pnpm --silent bench:bird:needs-train)" = "yes" ]; then
            BIRD_SPLIT=train pnpm bench:bird:fetch
          else
            echo "no arm in this dispatch reads the training split"
          fi
      # One call per endpoint before 1,534 questions. This workflow is the only one that can
      # name a second model, and it was the only one without a preflight: run `40792849132`
      # dispatched `second_model=glm-4.5`, drew 120 of 360 candidates — every `@second`
      # draw — from an endpoint that never answered, and spent three minutes finding out.
      # The preflight now checks both targets and says which one refused.
      - name: Provider preflight (every endpoint this run will call)
        run: pnpm eval:preflight
      - name: Gold queries and controls without a model
        run: pnpm bench:bird:dry
      - name: Four-arm evaluation on the public split
        run: pnpm bench:bird
        env:
          # Blank means the whole split; the runner parses it, because an empty
          # environment variable is a string and `Number('')` is zero.
          BIRD_LIMIT: ${{ inputs.limit }}
      - name: Accuracy floor
        run: pnpm gate:bird
      # Zero model calls, and the only reading in this workflow about the half of the score
      # that is not the selector. Printed before the summary so a failed run still shows it.
      - name: Where the candidate set had no answer
        run: pnpm bench:bird:gap
      # Splits the values bucket into the clause a fix would change, one oracle query per
      # case and no model call. No `--strict` here on purpose: the dev split is where a new
      # bucket is tried, and a reading that says "the taxonomy covers 72% of this" is the
      # finding rather than a reason to red the run. The gate lives in `ci.yml`, on the split
      # and arm it has been measured on.
      #
      # Five steps below and one in each of the next four: the arm they price is chosen, not
      # written. They said `--arm select` until `41356370371` dispatched `select-mixed,select-cross`
      # and died here with "has no arm select; it holds select-cross, select-mixed" — after the
      # evaluation had finished and the floor had passed. `select` is an arm the Mini-Dev chain
      # always runs and a dev dispatch runs only when asked, and `$BIRD_ARMS` is the request that
      # knows the difference. `tools/bird-arm.mjs` answers it, and is tested for both edges: a
      # request the artifact cannot meet, and a request that names nothing.
      - name: What kind of wrong the no-answer statements are
        run: pnpm bench:bird:gap:values eval/out/bird-eval.json --arm "$(node tools/bird-arm.mjs eval/out/bird-eval.json)"
      # The same instrument on the split with room for a result. No `--strict`: the ceiling is
      # a reading, and the two failures it can catch are the ones the Mini-Dev gate already
      # fails on.
      - name: What the prompt costs, and what a smaller card would save
        run: pnpm bench:bird:card eval/out/bird-eval.json --arm "$(node tools/bird-arm.mjs eval/out/bird-eval.json)"
      # The same reading on the split with room for a result, and without `--strict` for the same
      # reason the card step omits it: the depth table is a ceiling, and the failures it can catch
      # are the ones the Mini-Dev gate already fails on.
      - name: What a question names, and what its answer joins
        run: pnpm bench:bird:join eval/out/bird-eval.json --arm "$(node tools/bird-arm.mjs eval/out/bird-eval.json)"
      # The same instrument on the split with room for a result. No `--strict`: the two failures
      # this gate can catch are absolute (nothing read, or a card rebuilt without the text the
      # run placed on it) and the dev split is where a rendering bug shows up first, but the
      # shape of the answer — how many failures needed a value the prompt never spells — is a
      # reading, and a reading is the finding rather than a reason to red the run.
      - name: What the prompt would have had to say
        run: pnpm bench:bird:info eval/out/bird-eval.json --arm "$(node tools/bird-arm.mjs eval/out/bird-eval.json)"
      # The census the next lever is sized against: of the statements that ran and were wrong, how
      # many never name a column the gold filters on, and which columns those are. Two statements
      # and the gold the run already holds — zero queries, zero model calls — which is why it can
      # run on every dispatched dev run rather than on a sample.
      #
      # No `--strict`, for the reason the four steps around it omit it: the share is a reading, and
      # a reading is the finding rather than a reason to red the run. The two failures it can catch
      # are the ones the Mini-Dev gate already fails on. Until this step existed, the only census
      # this repository had was taken on 498 questions, and the split that decides adoption had
      # never been measured at all.
      - name: Which filter the statement never wrote
        run: pnpm bench:bird:conditions eval/out/bird-eval.json --arm "$(node tools/bird-arm.mjs eval/out/bird-eval.json)"
      # The census says which conditions are missing; this says whether the question alone could
      # have said so before the statement was written. It costs no call and no query, and the
      # verdict line is the reason it runs on every dispatch: a gate whose ceiling is under the
      # split's resolution cannot produce a readable arm however good the repair is.
      - name: What the question alone can find
        run: pnpm bench:bird:gate --artifact eval/out/bird-eval.json --arm "$(node tools/bird-arm.mjs eval/out/bird-eval.json)"
      # 1534 gold statements and 515 no-answer statements through one literal edit, one oracle
      # query each and no model call. No `--strict`: this is where a repair is tried on the
      # split that has room for one, and a reading that says "it recovers two" is the finding.
      - name: What one provable edit recovers, and what it would break
        run: pnpm bench:bird:repair eval/out/bird-eval.json --arm "$(node tools/bird-arm.mjs eval/out/bird-eval.json)"
      # The candidate-set reading, on the split that can resolve it: five arms, two of them
      # with a candidate set, so the union and the marginal pool are both measurable here and
      # neither is on 496 questions.
      - name: What one more candidate would buy
        run: pnpm bench:bird:pool --artifact eval/out/bird-eval.json
      # The question underneath the previous one, and the one this repository can answer for free:
      # a pool of three candidates that return the same result three times costs three calls and
      # carries one opinion. `pool` prices the union; this prices its independence — how many
      # distinct results a case actually holds, which source carries cases alone, and how much of
      # the lost ceiling is a loss *the candidates agreed on*, which no selector can reach.
      - name: How many opinions the pool holds
        run: pnpm bench:bird:diversity eval/out/bird-eval.json
      # The other factor of the same product, priced on the split that can resolve it. Selection
      # losses here are 23 questions on `select-mixed` against 72 on `select`, so a rule that
      # converts one arm and not the other is only visible at this size.
      - name: Which selection rule kept the answer
        run: pnpm bench:bird:consensus --artifact eval/out/bird-eval.json
      # The run that fails is the run whose numbers matter most, and these two steps used to
      # run only on success: `40534288883` failed the floor gate and the artifact — the only
      # copy of the per-case rows and the McNemar p-values — was never uploaded, so the run
      # could not be read at all. The summary states the absence instead of crashing on it.
      - name: Publish summary
        if: always()
        run: |
          if [ -f eval/out/bird-eval.json ]; then
            node tools/bird-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no artifact was written, so there is nothing to summarise' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload dev evaluation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bird-dev-eval
          path: |
            eval/out/bird-eval.json
            eval/out/bird-summary.md
          if-no-files-found: warn
          retention-days: 30
