name: text2vis-judge

# The half of the chart reading that needs eyes.
#
# `profile.ts` counts whether the recommender named the corpus's label and `render.ts` counts whether
# the emitted source produced a PNG. Neither answers the question a chart system is for: whether the
# picture says what the question asked. Reading the pixels is the one step in this evaluation that a
# counter cannot take, so it is bought — one call per row, two dimensions in that call — and priced.
#
# Dispatch-only, and not on `push`, for two reasons that are both about money:
#
# 1. It spends a model call per figure. 1,286 calls on a provider that charges per image is a bill a
#    push cannot authorise, and a workflow that spends it on every commit to `eval/text2vis/**` would
#    be a bill nobody chose.
# 2. It needs an endpoint that can *see*. The BIRD jobs run on a text-only backbone, so the default
#    here is deliberately not the key those jobs use: `ZHIPU_API_KEY` is the org secret that holds a
#    vision endpoint's key, and `glm-4.5v` is the current vision model on `open.bigmodel.cn`.
#    `secret_name`, `model` and `base_url` name the endpoint; `eval/text2vis/judge.ts` declares the
#    rest of what differs between vendors (how an image is spelled, what temperature to name).
#
# The first step after install is one call that asks the endpoint to name the colour of a red image.
# It costs a call and answers the only question that cannot be answered locally — whether this url,
# this model name, this key and this image spelling reach a model that can see — before anything is
# drawn. A run that failed there used to fail after 1,286 figures had been rendered.
#
# The two readings above it are re-taken here rather than reused, because a judge report is only
# comparable with a render report taken on the same corpus in the same run: the denominator is the
# number of figures that exist, and a file from last week is a different population.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'The secret holding a vision endpoint key (DEEPSEEK_API_KEY is text-only)'
        required: true
        default: 'ZHIPU_API_KEY'
        type: string
      model:
        description: 'The vision model to grade with'
        required: true
        default: 'glm-4.5v'
        type: string
      base_url:
        description: 'The chat-completions base url'
        required: true
        default: 'https://open.bigmodel.cn/api/paas/v4'
        type: string
      think:
        # The one cost lever left in this instrument: 98.3% of the fifth reading's completion tokens
        # were deliberation before two integers. `default` sends nothing and is what every published
        # number was taken with; `off` is the cheap arm of a paired A/B on the same figures.
        description: 'Decode mode: default leaves it to the endpoint, on/off asks'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - 'off'
          - 'on'
      limit:
        description: 'Grade only the first N figures (0 grades every one)'
        required: true
        default: '0'
        type: string
      concurrency:
        # 10 was measured at 82 minutes for 1,286 figures and cost 8 rows to `429 您的账户已达到速率限制`
        # in a burst; 6 keeps the wall clock near two hours and the pressure below the ceiling. The
        # vendor's limit is not published, so this is the number two readings agree is safe.
        description: 'Calls in flight at once (measured: 49 s per call, so 1 would take 17 h)'
        required: true
        default: '6'
        type: string
      sample:
        # A stride, not a prefix: `limit` takes the first N rows of a corpus ordered by index, and two
        # arms of an experiment drawn from a prefix are paired within one population. `sample` takes
        # every k-th row, so the same number is the same rows on every machine and in every arm.
        description: 'Grade every k-th row so that at most N are graded (0 grades them all)'
        required: true
        default: '0'
        type: string
      max_calls:
        # The belt beside `abortAfter`. `abortAfter` learns that the endpoint has stopped answering;
        # this one is a budget chosen before the run, for a dispatch that would rather stop than
        # discover a misconfiguration on row 1,400. Reaching it is a red run: `limit` is how a sample
        # is declared, and a sample publishes its unselected rows in advance.
        description: 'Stop after N calls (0 means no ceiling)'
        required: true
        default: '0'
        type: string

permissions:
  contents: read

# One at a time, keyed on the secret rather than the ref: the point of the lock is the rate limit the
# endpoint enforces on one key, and two concurrent graders on that key would measure the limit.
concurrency:
  group: text2vis-judge-${{ inputs.secret_name }}
  cancel-in-progress: false

jobs:
  judge:
    name: what the figures are worth, one call each
    runs-on: ubuntu-latest
    # 1,286 graded figures, one call each, eight in flight. The number is a budget and not a
    # measurement, but it is now arithmetic rather than a guess: the rehearsal measured **49 seconds
    # per call** (6 rows, 8 attempted) on this endpoint, so a serial run is 17½ hours — longer than
    # this runner will hold a job — and eight in flight is 2¼. The margin is for the tail and for
    # retries inside the provider.
    timeout-minutes: 240
    env:
      LLM_API_KEY: ${{ secrets[inputs.secret_name] }}
      LLM_MODEL: ${{ inputs.model }}
      LLM_BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One call, before the corpus is fetched and before a figure is drawn. Everything this run
      # depends on that cannot be checked from here — the base url, the model name, the key, the way
      # the image is spelled — is a 400 on this call or a wrong colour, and both are cheaper now.
      - name: Ask the endpoint to name a colour
        run: pnpm bench:text2vis:judge --probe-only

      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: eval/.cache/text2vis
          key: text2vis-corpus-v1

      # The denominator, from the same run: the judge grades the figures that exist, and it refuses a
      # render artifact whose counts do not match the corpus it was handed.
      - name: Score the recommender
        run: pnpm bench:text2vis:profile --artifact eval/out/text2vis-profile.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the renderer's one dependency
        run: python3 -m pip install --quiet 'matplotlib==3.10.8'
      - name: Draw every chart, and keep the pictures
        run: pnpm bench:text2vis:render --artifact eval/out/text2vis-render.json --keep

      # The eleven readings before this round each re-graded every figure, including the ~1,280 whose
      # bytes and question had not changed since the reading before — twelve full readings in two days.
      # The store below turns a reading into a reading of the rows that changed.
      #
      # The key names *the figures*, not the run. A PNG is a function of the code that draws it, the
      # corpus it is drawn from, and the renderer's version, and all three are in the key; the artifact
      # is deliberately not, because it carries latency and byte counts that differ between two runs
      # over identical pictures. `restore-keys` then restores the most recent store — safe, because an
      # entry is only ever returned for a byte-identical picture with an identical prompt, mode and
      # model, so an over-broad restore can produce hits and never a wrong one.
      - name: Name the figures this run will grade
        id: figures
        run: echo "digest=$(sha256sum eval/.cache/text2vis/*.csv 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Keep the answers already paid for
        uses: actions/cache@v4
        with:
          path: eval/.cache/judge
          key: text2vis-judge-${{ steps.figures.outputs.digest }}-${{ hashFiles('packages/chart/src/**', 'eval/text2vis/render.ts', 'eval/text2vis/profile.ts', 'eval/text2vis/rule.ts', 'eval/text2vis/dataset.ts', 'eval/text2vis/judge-cache.ts', '.github/workflows/text2vis-judge.yml') }}
          restore-keys: |
            text2vis-judge-${{ steps.figures.outputs.digest }}-
            text2vis-judge-

      # No separate preflight step: the judge spends its first call asking the endpoint to name the
      # colour of a red image, and refuses the run when the answer did not see one. That check lives in
      # the instrument rather than in this file because it is not a property of the workflow — a run
      # started by hand from a laptop needs it exactly as much, and one that only `ci.yml` enforced
      # would be a guard on the door nobody uses.
      - name: Say which endpoint is about to grade
        run: echo "grading with $LLM_MODEL at $LLM_BASE_URL, key from ${{ inputs.secret_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Grade the figures
        run: |
          # The mode is appended rather than always passed: `--think default` is not a mode, and a
          # flag that has to be spelled differently from every other one is a flag a dispatch gets
          # wrong. Empty means the endpoint decides, which is what every earlier reading did.
          THINK=""
          if [ "${{ inputs.think }}" != "default" ]; then THINK="--think ${{ inputs.think }}"; fi
          SAMPLE=""
          if [ "${{ inputs.sample }}" != "0" ]; then SAMPLE="--sample ${{ inputs.sample }}"; fi
          CAP=""
          if [ "${{ inputs.max_calls }}" != "0" ]; then CAP="--max-calls ${{ inputs.max_calls }}"; fi
          if [ "${{ inputs.limit }}" = "0" ]; then
            pnpm bench:text2vis:judge --render eval/out/text2vis-render.json --png eval/.cache/text2vis/png --artifact eval/out/text2vis-judge.json --concurrency "${{ inputs.concurrency }}" $SAMPLE $CAP $THINK
          else
            pnpm bench:text2vis:judge --render eval/out/text2vis-render.json --png eval/.cache/text2vis/png --artifact eval/out/text2vis-judge.json --limit "${{ inputs.limit }}" --concurrency "${{ inputs.concurrency }}" $SAMPLE $CAP $THINK
          fi

      # The floor this reading was registered under: one call per attempted row, every row in exactly
      # one partition, both means on the 0-10 scale. The means themselves are printed and not compared
      # — nothing is recorded to regress against yet, and this step is what will make the next round
      # able to register them.
      # `always()`, because the day this assertion matters is the day the grading step exited non-zero:
      # run 44027154427 wrote a complete report and lost the two columns of its own shape check to the
      # two refusals above it, so the artifact was published and never held to its arithmetic.
      - name: Hold the grading to its shape
        if: always()
        run: node tools/check-text2vis-baseline.mjs --require --require-judge

      - name: Upload the reading
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: text2vis-judge
          path: |
            eval/out/text2vis-judge.json
            eval/out/text2vis-render.json
            eval/out/text2vis-profile.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the summary
        if: always()
        run: |
          if [ -f eval/out/text2vis-judge.json ]; then
            node -e "
              const report = require('./eval/out/text2vis-judge.json');
              const lines = [
                '### Text2Vis: the figures, graded by ' + process.env.LLM_MODEL,
                '',
                '| reading | value |',
                '| --- | --- |',
                '| graded by | ' + report.grader.model + ' (' + report.grader.endpoint + ') |',
                '| the vision probe answered | ' + report.probe.answer + ' |',
                '| chart_correctness | ' + (report.means.chart_correctness === null ? 'no reading' : report.means.chart_correctness.toFixed(2) + '/10') + ' |',
                '| readability | ' + (report.means.readability === null ? 'no reading' : report.means.readability.toFixed(2) + '/10') + ' |',
                '| judged | ' + report.judged + ' of ' + report.charts + ' charts |',
                '| failed / unselected / skipped | ' + report.failed + ' / ' + report.notSelected + ' / ' + report.skipped + ' |',
                '| why they failed | ' + (report.failed === 0 ? '—' : Object.entries(report.failedByKind).filter(([, rows]) => rows > 0).map(([kind, rows]) => rows + ' ' + kind).join(', ')) + ' |',
                '| calls | ' + report.calls + ' (' + report.callsPerRow.toFixed(3) + ' per judged row) |',
                // The two rows this round exists for. A reading that re-published yesterday's opinion
                // of most of the corpus and a reading that looked at every figure are the same two
                // means, and the difference between them is this line.
                '| answered from the store | ' + (report.cached === undefined ? 0 : report.cached) + ' of ' + report.judged + ' judged rows |',
                '| bill | ' + (report.bill === undefined || report.bill.yuan === null
                  ? 'no price on file for ' + report.grader.model + ', so the tokens above are the only figure'
                  : '¥' + report.bill.yuan.toFixed(3) + (report.bill.savedYuan === null || report.bill.savedYuan === 0 ? '' : ', and ¥' + report.bill.savedYuan.toFixed(3) + ' not spent because the answers were already paid for')) + ' |',
                '| tokens | ' + (report.tokens.reported === 0 ? 'the endpoint reported none' : report.tokens.prompt + ' prompt, ' + report.tokens.completion + ' completion (' + report.tokens.reasoning + ' reasoning), over ' + report.tokens.reported + ' rows |'),
                // A run that stopped is not a reading, said in the summary where the two means are:
                // `44155803661` printed 2.58 over 244 of 1,418 rows and nothing on the page said so.
                ...(report.aborted === undefined ? [] : ['| **stopped** | ' + report.aborted.streak + ' calls in a row without a reply; ' + report.aborted.attempted + ' of ' + report.charts + ' charts attempted, ' + (report.charts - report.aborted.attempted) + ' never asked about — **this is not a reading** |']),
                '',
                'Two means, not a pass rate: a grader score is ordinal and has no calibrated threshold.'
              ];
              // A sample is audited here, because the whole question a rehearsal answers is whether
              // this grader is reading these figures. A full run leaves the rows in the artifact.
              if (report.notSelected > 0 && Array.isArray(report.verdicts)) {
                lines.push('', '| row | correctness | readability | ms | what the grader wrote |', '| --- | --- | --- | --- | --- |');
                for (const v of report.verdicts) {
                  const wrote = String(v.reply || v.error || '').replace(/\|/g, '\\|').slice(0, 120);
                  const one = v.chart_correctness === undefined ? '—' : v.chart_correctness;
                  const two = v.readability === undefined ? '—' : v.readability;
                  const ms = v.ms === undefined ? '—' : v.ms;
                  lines.push('| ' + v.id + ' | ' + one + ' | ' + two + ' | ' + ms + ' | ' + wrote + ' |');
                }
              }
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            "
          else
            echo 'no judge report was written, so there is nothing to summarise' >> "$GITHUB_STEP_SUMMARY"
          fi
