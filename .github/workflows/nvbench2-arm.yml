name: nvbench2-arm

# nvBench 2.0, answered rather than only judged.
#
# `nvbench2-check.yml` establishes that the corpus is scorable and that the ported judge agrees with
# the reference on both splits. This workflow is the first arm that *answers* it: one call per
# question, `k` Vega-Lite fragments back, scored by that judge.
#
# **Dispatch-only.** 750 calls is a number that moves when the prompt or the model moves, and a
# `push` trigger would spend it on every commit to `eval/nvbench2/**` in exchange for the same
# number. The answers are content-addressed, so a second dispatch of an unchanged prompt costs
# nothing and a prompt edit pays only for the rows whose request changed.
#
# **The comparable number is the corpus's prompting baseline, ≈58.96 F1@3**, not the 81.50 a
# fine-tuned system reads (ADR 0001). This repository does not train, so the honest target is the
# first one, and the reading is reported beside the corpus's own ceiling — the cap the gold-set sizes
# impose before any model is asked (`facts.ceiling`).

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model that answers (a chat tier is the baseline; a reasoning tier is the strong arm)'
        required: true
        default: 'deepseek-chat'
        type: string
      provider:
        description: 'Vendor, which decides the host and the key together'
        required: true
        default: 'deepseek'
        type: choice
        options:
          - 'deepseek'
          - 'zhipu'
      split:
        description: 'Split to answer'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'test'
      k:
        description: 'Scoring width: which F1@k the reading is over (3 and 5 are what the leaderboard reports)'
        required: true
        default: '3'
        type: string
      ask:
        description: 'Charts asked for per call; 0 means the scoring width. Wider than k pays only when the extra charts are golds'
        required: false
        default: '0'
        type: string
      limit:
        description: 'Ask only the first N questions (0 asks every question)'
        required: true
        default: '0'
        type: string
      budget:
        description: 'Ceiling in yuan for this dispatch; the run refuses to start if the quote is over it (none = an unpriced model, typed deliberately)'
        required: true
        default: '12'
        type: string
      samples:
        description: 'Keep the first N answered rows verbatim in the artifact (0 keeps none)'
        required: false
        default: '0'
        type: string
      rules:
        description: 'Comma-separated prompt rules: count, variants, values, ranks, corpus, corpus2, steps, spread — or `none`'
        required: false
        default: 'count,corpus,corpus2'
        type: string
      mirrors:
        description: 'Offer the transposed reading of a rect or point chart: none, interleave (behind its chart) or append'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'interleave'
          - 'append'
      replay:
        description: 'Replay only: refuse to call the endpoint if any of these questions is missing from the answer store'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      replica:
        description: 'Send the corpus''s own prompt instead: none, basic, basicFull, steps, stepsFull. Rules are ignored when set'
        required: false
        default: 'none'
        type: string
      max_tokens:
        description: 'Answer budget per call; a reasoning tier needs more room than a chat tier'
        required: false
        default: '900'
        type: string
      timeout_ms:
        description: 'Per-call deadline in milliseconds; one call past it aborts the whole run'
        required: false
        default: '60000'
        type: string
      retries:
        description: 'Attempts per call; a reset connection produced no answer and no bill'
        required: false
        default: '3'
        type: string
      concurrency:
        description: 'Calls in flight at once (a reasoning tier with a long prompt needs more than a chat tier)'
        required: true
        default: '8'
        type: string

permissions:
  contents: read

# One group per instrument rather than per ref: two arms of one commit are independent readings, and
# queueing them behind each other halves the rate a hypothesis can be tested at. Every input that makes
# a different request is therefore in the key — including the ask (whose absence dropped two of four
# arms dispatched together: GitHub keeps a single *pending* run per group and cancels the older pending
# one, so the two that lost were the ones differing only in how many charts they asked for, and they
# came back `cancelled` with no artifact and no reading) and the mirrors flag, which changes the scored
# list while leaving the request untouched, so it is in the group and not in the cache key. The same
# arm twice still queues, because two
# dispatches of one arm share the answer cache and the second would race the first for its keys.
concurrency:
  group: nvbench2-arm-${{ github.ref }}-${{ inputs.model }}-${{ inputs.split }}-k${{ inputs.k }}-a${{ inputs.ask }}-${{ inputs.rules }}-r${{ inputs.replica }}-m${{ inputs.mirrors }}
  cancel-in-progress: false

jobs:
  arm:
    name: what a model answers, judged by the ported judge
    runs-on: ubuntu-latest
    # Four hours, not one. The 60 was sized for a chat tier answering in two seconds a call; a
    # reasoning tier writes 700 to 2,000 thinking tokens before its array, and one long prompt at
    # concurrency 4 needs more than an hour for 750 questions. Two full-split arms were killed at
    # exactly 60 minutes with no artifact and no cache save — the runner gives a timed-out job no
    # chance to run its `if: always()` steps, so the answers were paid for and discarded. The number
    # has to be a property of the slowest instrument, not of the one it was first measured with.
    timeout-minutes: 240
    env:
      LLM_API_KEY: ${{ inputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || secrets.ZHIPU_API_KEY }}
      LLM_BASE_URL: ${{ inputs.provider == 'deepseek' && 'https://api.deepseek.com/v1' || 'https://open.bigmodel.cn/api/paas/v4' }}
      NVBENCH2_MODEL: ${{ inputs.model }}
      NVBENCH2_TIMEOUT_MS: ${{ inputs.timeout_ms }}
      NVBENCH2_RETRIES: ${{ inputs.retries }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `metadata.py` is Python because the reference's type rule is pandas' dtype inference.
      - name: Install the reference's dependency
        run: python3 -m pip install --quiet pandas
      - run: pnpm install --frozen-lockfile

      # The corpus is immutable upstream; caching it keeps a reading from reporting a network as a
      # score when the network is what failed.
      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: |
            eval/.cache/nvbench2/dev.json
            eval/.cache/nvbench2/test.json
            eval/.cache/nvbench2/database_csv
          key: nvbench2-corpus-v1

      - name: Fetch the corpus
        run: node eval/nvbench2/fetch.mjs

      # The type map the judge reverses axes by, rebuilt from the published tables.
      - name: Rebuild the type map
        run: pnpm bench:nvbench2:metadata

      # The gate before the spend: every gold parses, every field is typed, and the map agrees with
      # the corpus's own `column_examples` on all 8,952 field decisions.
      - name: Check the corpus
        run: pnpm bench:nvbench2:check

      # The rest of the key, flattened into a slug. The lesson is `text2vis-llm.yml`'s: an input is
      # free text and a cache key is not, so a value containing a comma is a key GitHub refuses.
      - name: Name the instrument this run asks with
        id: instrument
        env:
          MODEL: ${{ inputs.model }}
          SPLIT: ${{ inputs.split }}
          K: ${{ inputs.k }}
          ASK: ${{ inputs.ask }}
          RULES: ${{ inputs.rules }}
          REPLICA: ${{ inputs.replica }}
        run: |
          # `count,variants` is an arm and so is `count`: the slug names it, so two arms do not share
          # a cache entry and a save from one cannot hide from the other.
          arm="$(printf '%s' "${RULES:-none}" | tr ',' '+')"
          # The ask is part of the instrument, but only when it differs from the scoring width: an ask
          # equal to k is the same request as before, and giving it a new slug would throw away the
          # answers already paid for under the old one.
          if [ "$ASK" != "0" ] && [ "$ASK" != "$K" ]; then arm="$arm+ask$ASK"; fi
          # A replica replaces the instruction, so its name belongs in the slug for the same reason a
          # rule's does: two prompts must not share one answer store.
          if [ "$REPLICA" != "none" ] && [ "$REPLICA" != "" ]; then arm="replica-$REPLICA"; fi
          echo "slug=$(printf '%s-%s-%s-%s' "$MODEL" "$SPLIT" "$K" "$arm" | tr -c 'A-Za-z0-9._-' _)" >> "$GITHUB_OUTPUT"
          # `none` rather than the empty string, because a dispatch input left empty falls back to its
          # default and an arm that says "no rules" must not quietly run with both of them.
          if [ "$RULES" = "none" ]; then echo "list=" >> "$GITHUB_OUTPUT"; else echo "list=$RULES" >> "$GITHUB_OUTPUT"; fi

      # The answers, keyed by the request rather than by the calendar: model, split, k, the output cap
      # and the code that builds the prompt.
      #
      # `max_tokens` is in this key and it was not before, and that omission cost a full reasoning arm.
      # The answer store is keyed by the request, and the request contains the cap — so a dispatch at
      # 2600 tokens and one at 900 hold *different* entries, while an archive keyed only by source
      # files is one archive for both. Two dispatches therefore reserved one key, the second save was
      # refused (`Unable to reserve cache … another job may be creating this cache`), and 750 paid
      # answers were discarded. The next run quoted all 751 questions at ¥19.75 because the store it
      # restored held entries for the other cap.
      #
      # The rule is the one the answer store already follows: an archive key must contain every input
      # that changes an answer key. `--limit` does not, because a prefix of the split is a prefix of
      # the same keys.
      - name: Keep the answers already paid for
        id: answers
        uses: actions/cache/restore@v4
        with:
          path: eval/.cache/nvbench2/answers
          key: nvbench2-answers-${{ steps.instrument.outputs.slug }}-mt${{ inputs.max_tokens }}-${{ hashFiles('eval/nvbench2/arm.ts', 'eval/nvbench2/facts.ts', 'eval/nvbench2/judge.ts', 'eval/nvbench2/corpus-text.ts', 'eval/nvbench2/corpus-prompt.ts') }}
          restore-keys: |
            nvbench2-answers-${{ steps.instrument.outputs.slug }}-mt${{ inputs.max_tokens }}-

      - name: Ask every question
        env:
          K: ${{ inputs.k }}
          LIMIT: ${{ inputs.limit }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SPLIT: ${{ inputs.split }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
        run: |
          EXTRA=""
          if [ "$LIMIT" != "0" ]; then EXTRA="--limit $LIMIT"; fi
          ASK="${{ inputs.ask }}"
          if [ "$ASK" != "0" ]; then EXTRA="$EXTRA --ask $ASK"; fi
          if [ "${{ inputs.samples }}" != "0" ]; then EXTRA="$EXTRA --samples ${{ inputs.samples }}"; fi
          if [ "${{ inputs.replica }}" != "none" ]; then EXTRA="$EXTRA --replica ${{ inputs.replica }}"; fi
          if [ "${{ inputs.replay }}" = "true" ]; then EXTRA="$EXTRA --replay"; fi
          if [ "${{ inputs.mirrors }}" != "none" ]; then EXTRA="$EXTRA --mirrors ${{ inputs.mirrors }}"; fi
          pnpm bench:nvbench2:arm --split "$SPLIT" --k "$K" --concurrency "$CONCURRENCY" $EXTRA \
            --max-tokens "$MAX_TOKENS" --budget "${{ inputs.budget }}" \
            --rules "${{ steps.instrument.outputs.list }}" --artifact eval/out/nvbench2-arm.json

      # Before the gate, not after: a run that misses its floor has still bought its answers.
      - name: Keep what this run paid for
        if: always()
        uses: actions/cache/save@v4
        with:
          path: eval/.cache/nvbench2/answers
          key: ${{ steps.answers.outputs.cache-primary-key }}

      - name: Upload the reading
        if: always()
        uses: actions/upload-artifact@v5
        with:
          # The slug, not the model and the split: four arms of one model and one split differ only
          # in their prompt, and an artifact named after the model cannot say which prompt it read.
          name: ${{ steps.instrument.outputs.slug }}
          path: eval/out/nvbench2-arm.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish the summary
        if: always()
        run: |
          if [ -f eval/out/nvbench2-arm.json ]; then
            node -e "
              const payload = require('./eval/out/nvbench2-arm.json');
              const pct = (value) => (value * 100).toFixed(2) + '%';
              const at = (k) => payload.reading.f1[String(k)] === undefined ? '—' : pct(payload.reading.f1[String(k)]);
              const d = payload.diagnostic;
              const aspects = ['mark', 'channels', 'field', 'aggregate', 'properties', 'transform', 'rest'];
              const perQuestion = (d.predictions / payload.asked).toFixed(2);
              const lines = [
                '### nvBench 2.0 · ' + payload.split + ' · ' + payload.model,
                '',
                '| reading | value |',
                '| --- | --- |',
                '| rules | ' + (payload.rules.length === 0 ? 'none' : payload.rules.join(', ')) + ' |',
                '| F1@1 | ' + at(1) + ' |',
                '| F1@3 | ' + at(3) + ' |',
                '| F1@5 | ' + at(5) + ' |',
                '| ceiling (gold sets, no arm) | ' + pct(payload.facts.ceiling['3']) + ' |',
                '| questions | ' + payload.asked + ' |',
                '| charts asked for | ' + (payload.ask ?? payload.k) + ' |',
                '| charts produced | ' + payload.produced + ' |',
                '| charts per question | ' + perQuestion + ' |',
                '| unparsed replies | ' + payload.unparsed + ' |',
                '| truncated replies | ' + payload.truncated + ' |',
                '| calls that failed | ' + (payload.failed ?? 0) + ' |',
                '| calls | ' + payload.cost.calls + ' |',
                '| tokens | ' + payload.cost.promptTokens + ' in / ' + payload.cost.completionTokens + ' out |',
                '| cost | ' + (payload.cost.yuan === undefined ? 'unpriced' : '¥' + payload.cost.yuan.toFixed(4)) + ' |',
                '',
                'Where the misses stop agreeing, over ' + d.predictions + ' predictions of which ' + d.matched + ' matched:',
                '',
                '| first break | misses |',
                '| --- | --- |',
              ].concat(aspects.map((a) => '| ' + a + ' | ' + d.first[a] + ' |')).concat([
                '',
                '| probe | misses one convention away |',
                '| --- | --- |',
                '| equal once a count names no field | ' + d.countFieldless + ' |',
                '',
                'The prompting baseline this arm is comparable with is ≈58.96 F1@3; a fine-tuned system',
                'reads 81.50 and is not a target for a repository that does not train (ADR 0001).'
              ]);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            "
          else
            echo 'no reading was written, so there is nothing to summarise' >> "$GITHUB_STEP_SUMMARY"
          fi
